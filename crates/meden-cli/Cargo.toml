[package]
name = "meden-cli"
description = "Interactive coding agent and isolated JSON Lines automation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "meden"
path = "src/main.rs"

[dependencies]
meden-core = { path = "../meden-core", version = "0.1.0" }
meden-agent = { path = "../meden-agent", version = "0.1.0" }
meden-llm = { path = "../meden-llm", version = "0.1.0" }
meden-runtime = { path = "../meden-runtime", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
tempfile = "3"
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "0.31", features = ["fs"] }

[lints]
workspace = true

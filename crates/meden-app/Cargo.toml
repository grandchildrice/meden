[package]
name = "meden-app"
description = "Shared workspace, analysis and verification application services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
meden-core = { path = "../meden-core", version = "0.1.0" }
meden-agent = { path = "../meden-agent", version = "0.1.0" }
meden-runtime = { path = "../meden-runtime", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "=1.2.3"
sha2 = "0.10"
anyhow = "1"
base64 = "0.23"
tempfile = "3"

[dev-dependencies]
proptest = "1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[lints]
workspace = true

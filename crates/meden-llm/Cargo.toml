[package]
name = "meden-llm"
description = "Session-bound local inference and approved HTTP processors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
meden-core = { path = "../meden-core", version = "0.1.0" }
meden-agent = { path = "../meden-agent", version = "0.1.0" }
meden-runtime = { path = "../meden-runtime", version = "0.1.0" }
tempfile = "3"
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
yaml-rust2 = { version = "0.13", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["socket"] }

[lints]
workspace = true

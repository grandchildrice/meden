name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (fmt, clippy, test, doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux isolation backend
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check

  kani:
    name: kani (${{ matrix.harness }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: meden-core, harness: glob_literal_is_identity }
          - { package: meden-core, harness: star_matches_everything }
          - { package: meden-core, harness: deny_wins }
          - { package: meden-core, harness: allowed_iff_granted_and_not_denied }
          - { package: meden-core, harness: grants_are_monotone }
          - { package: meden-core, harness: scope_rules }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Install pinned Kani with verified public bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo install kani-verifier --locked --version 0.68.0
          bash tools/download-ci-asset.sh repos/model-checking/kani/releases/assets/566906903 \
            32e2b484d73ede0bbf64a2cf0879c4259422497d8aec4ee67d448de9ae7843d3 \
            "$RUNNER_TEMP/kani.tar.gz"
          cargo kani setup --use-local-bundle "$RUNNER_TEMP/kani.tar.gz"
      - run: cargo kani -p ${{ matrix.package }} --harness kani_harness::${{ matrix.harness }}

  lean:
    name: lean (spec builds, no sorry, standard axioms only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-17
          components: rustc-dev, llvm-tools
      - name: Install pinned Rust extraction tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/download-ci-asset.sh repos/AeneasVerif/aeneas/releases/assets/719588396 \
            14fbaed4ce8624cf3d668f887d6ebb237a59cc37d7498c792d9f3f97332cbb25 \
            "$RUNNER_TEMP/aeneas.tar.gz"
          mkdir "$RUNNER_TEMP/aeneas"
          tar -xzf "$RUNNER_TEMP/aeneas.tar.gz" -C "$RUNNER_TEMP/aeneas" aeneas charon charon-driver rust-toolchain
          echo "CHARON=$RUNNER_TEMP/aeneas/charon" >> "$GITHUB_ENV"
          echo "AENEAS=$RUNNER_TEMP/aeneas/aeneas" >> "$GITHUB_ENV"
      - name: Regenerate production Rust model and reject drift
        run: bash tools/extract-transfer.sh
      - name: Prepare pinned Lean toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(cat lean/lean-toolchain)" = 'leanprover/lean4:v4.35.0'
          sudo apt-get update && sudo apt-get install -y bubblewrap zstd
          bash tools/download-ci-asset.sh repos/leanprover/lean4/releases/assets/634574462 \
            7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d \
            "$RUNNER_TEMP/lean.tar.zst"
          mkdir "$RUNNER_TEMP/lean" "$RUNNER_TEMP/lean-path"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/lean"
          ln -s "$RUNNER_TEMP/lean/bin/lean" "$RUNNER_TEMP/lean-path/lean"
          ln -s "$RUNNER_TEMP/lean/bin/lake" "$RUNNER_TEMP/lean-path/lake"
          echo "$RUNNER_TEMP/lean-path" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: lean/.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}-${{ hashFiles('lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}-${{ hashFiles('lean/lake-manifest.json') }}-
      - name: Build pinned Lean specifications and implementation proofs
        working-directory: lean
        run: |
          lean --version
          lake exe cache get
          lake build
      - name: Forbid unfinished proofs and project axioms
        run: |
          if grep -rn --include='*.lean' -E '\b(sorry|admit|axiom)\b' lean/MedenSpec lean/MedenSpec.lean lean/MedenProof.lean lean/Main.lean verification/ledger; then
            echo "unfinished proof or project axiom found"; exit 1; fi
      - name: audit axioms
        working-directory: lean
        run: |
          lake env lean Audit.lean | tee audit.txt
          if grep -E 'sorryAx' audit.txt; then echo "sorryAx present"; exit 1; fi
          if grep -E "depends on axioms" audit.txt | grep -vE '^\S+ depends on axioms: \[(propext|Classical\.choice|Quot\.sound)(, (propext|Classical\.choice|Quot\.sound))*\]$' | grep -q .; then
            echo "non-standard axiom present"; exit 1; fi
      - name: Reject semantic faults in the actual Rust implementation
        run: python3 tools/check-refinement-mutants.py
      - uses: astral-sh/setup-uv@v7
      - name: Check real user-project proof and TUI/CLI contract flow offline
        run: |
          cargo build --release -p meden-cli
          python3 tools/prepare-verifier.py \
            --rust "$(rustup run nightly-2026-09-17 rustc --print sysroot)" \
            --charon "$CHARON" --driver "$RUNNER_TEMP/aeneas/charon-driver" \
            --aeneas "$AENEAS" --output "$RUNNER_TEMP/project-verifier.json"
          uv run --project python pytest -q python/tests/test_project_verification.py \
            --basetemp "$RUNNER_TEMP/ledger-project-tests"
        env:
          MEDEN_BIN: ${{ github.workspace }}/target/release/meden
          MEDEN_VERIFIER_BUNDLE: ${{ runner.temp }}/project-verifier.json
      - uses: actions/upload-artifact@v7
        with:
          name: meden-ledger-evidence
          path: ${{ runner.temp }}/ledger-project-tests/**/artifacts/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: meden-spec
          path: lean/.lake/build/bin/meden-spec
          if-no-files-found: error

  python:
    name: python adapter (ruff, pytest against the binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux isolation backend
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: cargo build -p meden-cli
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --group dev
        working-directory: python
      - run: uv run ruff check . ../tools
        working-directory: python
      - run: uv run pytest -q
        working-directory: python
        env:
          MEDEN_BIN: ${{ github.workspace }}/target/debug/meden

  npm:
    name: npm package (launcher checks, packs cleanly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node npm/test.js
      - run: npm pack --dry-run
        working-directory: npm

  conformance:
    name: conformance (rust == lean on random cases)
    needs: [lean]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: meden-spec
          path: oracle
      - run: chmod +x oracle/meden-spec
      - run: cargo test -p meden-cli --test conformance -- --nocapture
        env:
          MEDEN_SPEC_BIN: ${{ github.workspace }}/oracle/meden-spec

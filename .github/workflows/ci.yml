name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (fmt, clippy, test, doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  kani:
    name: kani (${{ matrix.harness }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: meden-core, harness: glob_literal_is_identity }
          - { package: meden-core, harness: star_matches_everything }
          - { package: meden-core, harness: deny_wins }
          - { package: meden-core, harness: allowed_iff_granted_and_not_denied }
          - { package: meden-core, harness: grants_are_monotone }
          - { package: meden-core, harness: scope_rules }
          - { package: meden-core, harness: tier_rule }
          - { package: meden-agent, harness: untrusted_control_is_refused }
          - { package: meden-agent, harness: data_that_does_not_steer_is_allowed }
          - { package: meden-agent, harness: unreadable_is_not_disclosed }
          - { package: meden-agent, harness: rules_are_monotone_in_arguments }
    steps:
      - uses: actions/checkout@v7
      - uses: model-checking/kani-github-action@v1
        with:
          args: -p ${{ matrix.package }} --harness kani_harness::${{ matrix.harness }}

  lean:
    name: lean (spec builds, no sorry, standard axioms only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-mathlib-cache: false
          test: false
      - name: forbid sorry
        run: |
          if grep -rn --include='*.lean' -E '\bsorry\b' lean/MedenSpec lean/MedenSpec.lean lean/Main.lean; then
            echo "sorry found"; exit 1; fi
      - name: audit axioms
        working-directory: lean
        run: |
          lake env lean Audit.lean | tee audit.txt
          if grep -E 'sorryAx' audit.txt; then echo "sorryAx present"; exit 1; fi
          if grep -E "depends on axioms" audit.txt | grep -vE '^\S+ depends on axioms: \[(propext|Classical\.choice|Quot\.sound)(, (propext|Classical\.choice|Quot\.sound))*\]$' | grep -q .; then
            echo "non-standard axiom present"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: meden-spec
          path: lean/.lake/build/bin/meden-spec
          if-no-files-found: error
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: meden attest lean against the spec
        run: cargo test -p meden-cli --test attest -- --nocapture
      - name: the invariant catalogue describes these sources
        run: cargo run -p meden-cli -- invariants --explain

  python:
    name: python adapter (ruff, pytest against the binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p meden-cli
      - uses: astral-sh/setup-uv@v7
      # The declaration tests check every suite's tools against AgentDojo
      # itself, so AgentDojo has to be here.
      - run: uv sync --group dev --extra agentdojo
        working-directory: python
      - run: uv run ruff check .
        working-directory: python
      - run: uv run pytest -q
        working-directory: python
        env:
          MEDEN_BIN: ${{ github.workspace }}/target/debug/meden

  npm:
    name: npm package (launcher checks, packs cleanly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node npm/test.js
      - run: npm pack --dry-run
        working-directory: npm

  conformance:
    name: conformance (rust == lean on random cases)
    needs: [lean]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: meden-spec
          path: oracle
      - run: chmod +x oracle/meden-spec
      - run: cargo test -p meden-cli --test conformance -- --nocapture
        env:
          MEDEN_SPEC_BIN: ${{ github.workspace }}/oracle/meden-spec

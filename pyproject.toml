[project]
name = "t-agent"
version = "0.0.1"
description = "Proof-driven development for agent actions: a capability-typed runtime and attestation gate for LLM agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "T Agent contributors" }]
keywords = ["llm-agent", "formal-verification", "capability", "prompt-injection", "agentdojo", "lean4"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
agentdojo = ["agentdojo>=0.1.35"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["t_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
